<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Cat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --lav-1: #cdb9ec;
    --lav-2: #b79bdc;
    --lav-3: #a888cf;
    --mauve: #e79dc0;
    --mauve-dark: #cd6f9e;
    --mauve-darker: #b6538a;
    --plum: #5c3f6e;
    --plum-line: #6b4a7d;
    --ink: #3c2a49;
    --white: #fdfaff;
    --ice-a: #dcd2f7;
    --ice-b: #c3b3ef;
    --ice-c: #a793e0;
    --shadow: rgba(60, 30, 70, 0.45);
    --plaque: #e7a4c4;
    --plaque-dark: #cf7ea6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'VT323', monospace;
    color: var(--ink);
  }

  body {
    position: relative;
    min-height: 100vh;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(255,255,255,0.25), transparent 45%),
      linear-gradient(160deg, var(--lav-1) 0%, var(--lav-2) 55%, var(--lav-3) 100%);
    padding: 40px clamp(16px, 4vw, 64px) 60px;
    image-rendering: pixelated;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  button { font-family: inherit; }

  /* ---------------- background decorations ---------------- */
  .deco-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .deco {
    position: absolute;
    opacity: 0.55;
  }
  .deco.plus {
    background: #fff;
  }
  .deco.plus::before, .deco.plus::after {
    content: "";
    position: absolute;
    background: inherit;
  }
  .deco.star {
    background: #fff;
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    animation: twinkle 2.4s steps(2) infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: 0.75; } 50% { opacity: 0.15; } }

  /* plus shape via two rects */
  .plus-shape { position: relative; }
  .plus-shape .h { position: absolute; background: #fff; }
  .plus-shape .v { position: absolute; background: #fff; }

  /* ---------------- layout ---------------- */
  .desktop {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: clamp(24px, 4vw, 56px);
    align-items: flex-start;
    justify-content: center;
    max-width: 1180px;
    margin: 0 auto;
  }

  /* ================= retro window ================= */
  .win {
    width: 500px;
    max-width: 100%;
    background: var(--white);
    border: 3px solid var(--plum);
    box-shadow:
      inset 0 0 0 2px #fff,
      6px 6px 0 var(--shadow);
  }

  .win-titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: linear-gradient(180deg, var(--mauve) 0%, var(--mauve-dark) 100%);
    border-bottom: 3px solid var(--plum);
  }
  .win-icon canvas { width: 20px; height: 20px; image-rendering: pixelated; }
  .win-title {
    flex: 1;
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 2px 2px 0 var(--mauve-darker);
    user-select: none;
  }
  .win-controls { display: flex; gap: 5px; }
  .win-btn {
    width: 22px;
    height: 20px;
    background: var(--white);
    border: 2px solid var(--plum);
    box-shadow: 2px 2px 0 var(--mauve-darker);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    line-height: 1;
    color: var(--plum);
    cursor: pointer;
    padding: 0;
  }
  .win-btn:active { box-shadow: 0 0 0 var(--mauve-darker); transform: translate(2px, 2px); }
  .win-btn.close { color: #a33a5b; }

  .win-menubar {
    display: flex;
    gap: 18px;
    padding: 6px 12px;
    background: #f3e9f7;
    border-bottom: 3px solid var(--plum);
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--plum);
    letter-spacing: 0.5px;
  }
  .win-menubar span { cursor: default; user-select: none; }
  .win-menubar span:hover { color: var(--mauve-darker); }

  .win-content {
    position: relative;
    background: #ffffff;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-bottom: 3px solid var(--plum);
  }
  .win-content video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    display: none;
  }
  .win-content.live video { display: block; }
  .cam-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
  }
  .win-content.live .cam-placeholder { display: none; }
  .cam-placeholder canvas { width: 72px; height: 60px; opacity: 0.35; }
  .cam-placeholder .cam-msg {
    font-size: 16px;
    color: #b9a9c9;
    letter-spacing: 1px;
    text-align: center;
    padding: 0 20px;
  }

  .win-statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px;
    background: #f3e9f7;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 0.5px;
    color: var(--plum);
  }
  .win-statusbar .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 6px;
    background: #c8b8d6;
    border: 1px solid var(--plum);
  }
  .win-statusbar.watching .dot { background: #f0c95d; }
  .win-statusbar.detected .dot { background: #7bc97a; }

  /* ================= right column ================= */
  .side-col {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 26px;
    width: 340px;
    max-width: 100%;
  }

  /* ---- timer plaque ---- */
  .timer-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }

  .timer-plaque {
    position: relative;
    width: 100%;
    text-align: center;
    background: var(--plaque);
    border: 3px solid var(--plum);
    box-shadow:
      inset 3px 3px 0 rgba(255,255,255,0.35),
      inset -3px -3px 0 var(--plaque-dark),
      4px 4px 0 var(--shadow);
    padding: 14px 10px 10px;
    cursor: text;
  }
  .timer-plaque .digits {
    font-family: 'VT323', monospace;
    font-size: 46px;
    letter-spacing: 3px;
    color: #2a1830;
    line-height: 1;
    user-select: none;
  }
  .timer-plaque .digits.empty { color: #8a5f7c; }
  .timer-plaque input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    text-align: center;
    font-family: 'VT323', monospace;
    font-size: 46px;
    letter-spacing: 3px;
    color: #2a1830;
    padding: 0;
  }
  .timer-hint {
    margin-top: 6px;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    letter-spacing: 0.5px;
    color: #7c5c8f;
    text-align: center;
  }

  .timer-controls { display: flex; gap: 10px; }
  .pixel-btn {
    width: 46px;
    height: 40px;
    background: var(--white);
    border: 2px solid var(--plum);
    box-shadow: 3px 3px 0 var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .pixel-btn:active { box-shadow: 0 0 0 var(--shadow); transform: translate(3px, 3px); }
  .pixel-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .pixel-btn:disabled:active { box-shadow: 3px 3px 0 var(--shadow); transform: none; }
  .pixel-btn.play { background: #bfe6b4; }
  .pixel-btn.play.running { background: #f3ce6d; }
  .pixel-btn canvas { width: 18px; height: 18px; }

  .play-tri {
    width: 0; height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 13px solid #2f5a26;
  }
  .pause-bars { display: flex; gap: 4px; }
  .pause-bars span { width: 5px; height: 16px; background: #6b4d1a; display: block; }

  /* ---- scene: bowl + ice + cat ---- */
  .scene {
    position: relative;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 20px;
    padding-top: 70px;
  }

  .sparkle-near { position: absolute; }

  .bowl-wrap { flex: none; margin-bottom: 2px; }
  .bowl-wrap canvas { width: 88px; height: 50px; cursor: default; }

  .ice-column {
    position: relative;
    width: 88px;
    height: 210px;
    flex: none;
  }
  .ice-block {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%) scale(var(--shrink, 1));
    transform-origin: center bottom;
    width: 74px;
    height: 74px;
    transition: opacity 0.5s ease, transform 0.35s ease-out;
  }
  .ice-block img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; filter: drop-shadow(2px 3px 0 rgba(60,30,70,0.25)); }
  .ice-block.melted { opacity: 0; transform: translate(-50%, 16px) scale(0.8); pointer-events: none; }

  /* ---- water puddle at the base of the ice stack ---- */
  .water-puddle {
    position: absolute;
    left: 50%;
    bottom: -5px;
    transform: translateX(-50%);
    width: 38px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 35%, rgba(220,232,255,0.9), rgba(150,180,240,0.6) 55%, rgba(150,180,240,0) 82%);
    box-shadow: inset 0 0 0 1px rgba(92,63,110,0.18);
    opacity: 0.55;
    transition: width 0.6s ease, height 0.6s ease, opacity 0.6s ease;
    pointer-events: none;
    z-index: 0;
  }
  .water-puddle::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(120deg, rgba(255,255,255,0.75), transparent 45%);
    animation: puddleShimmer 3s ease-in-out infinite;
  }
  @keyframes puddleShimmer { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }

  .water-puddle.size-1 { width: 52px; height: 13px; opacity: 0.7; }
  .water-puddle.size-2 { width: 66px; height: 16px; opacity: 0.85; }
  .water-puddle.size-3 { width: 82px; height: 20px; opacity: 0.95; }

  .water-puddle.melting::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 6px;
    border: 2px solid rgba(255,255,255,0.75);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0.3);
    animation: rippleGrow 1.6s ease-out infinite;
  }
  @keyframes rippleGrow {
    0% { transform: translate(-50%, -50%) scale(0.25); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(2.1); opacity: 0; }
  }

  .drip {
    position: absolute;
    left: 50%;
    top: -6px;
    width: 4px;
    height: 8px;
    background: rgba(180,210,255,0.9);
    border-radius: 0 0 4px 4px;
    transform: translateX(-50%);
    opacity: 0;
  }
  .drip.drip2 { left: 62%; }
  .water-puddle.melting .drip { animation: dripFall 1.5s ease-in infinite; }
  .water-puddle.melting .drip2 { animation-delay: 0.75s; }
  @keyframes dripFall {
    0% { top: -22px; opacity: 0; }
    12% { opacity: 1; }
    78% { top: -2px; opacity: 1; }
    100% { top: 2px; opacity: 0; }
  }

  .cat-sprite {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    cursor: pointer;
    transition: bottom 0.6s cubic-bezier(.32,1.4,.5,1);
    filter: drop-shadow(3px 4px 0 rgba(60,30,70,0.35));
  }
  .cat-sprite img { width: 80px; height: auto; image-rendering: pixelated; display: block; transform-origin: center bottom; animation: catBreathe 2.6s ease-in-out infinite; }
  .cat-sprite:hover { filter: drop-shadow(3px 4px 0 rgba(60,30,70,0.35)) brightness(1.08); }
  @keyframes catBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }
  .cat-sprite.bounce { animation: catBounce 0.45s ease 4; }
  @keyframes catBounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-16px); }
  }
  .cat-sprite.click-pop { animation: catPop 0.22s steps(3); }
  @keyframes catPop {
    0% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(0.9); }
    100% { transform: translateX(-50%) scale(1); }
  }

  .scene-caption {
    width: 100%;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 0.5px;
    color: #5c3f6e;
    margin-top: 2px;
  }

  .complete-msg {
    display: none;
    width: 100%;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 0;
    line-height: 1.9;
    color: #2f6b2a;
    padding: 10px;
    border: 2px solid #6fae5f;
    background: #e3f5df;
    box-shadow: 3px 3px 0 var(--shadow);
  }
  .complete-msg.show { display: block; animation: popIn 0.3s ease; }
  @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  /* ---- confetti celebration ---- */
  .confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 50;
  }
  .confetti-piece {
    position: absolute;
    top: -16px;
    opacity: 0;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateY(105vh) rotate(var(--rot, 540deg)); opacity: 0; }
  }

  .warn-msg {
    display: none;
    width: 100%;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    line-height: 1.9;
    letter-spacing: 0;
    color: #8a4d12;
    padding: 10px;
    border: 2px solid #e0a233;
    background: #fbe6bd;
    box-shadow: 3px 3px 0 var(--shadow);
  }
  .warn-msg.show { display: block; animation: warnPulse 1.1s steps(2) infinite; }
  @keyframes warnPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  /* ================= cat selector popup ================= */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(60, 30, 70, 0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }

  .selector-win {
    width: 380px;
    max-width: 92vw;
    background: var(--white);
    border: 3px solid var(--plum);
    box-shadow: inset 0 0 0 2px #fff, 6px 6px 0 var(--shadow);
  }
  .selector-win .win-titlebar { }
  .selector-body {
    padding: 18px;
  }
  .selector-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--plum);
    margin-bottom: 14px;
    text-align: center;
  }
  .selector-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
  }
  .selector-item {
    width: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px 6px 8px;
    background: #f3e9f7;
    border: 2px solid var(--plum);
    box-shadow: 3px 3px 0 var(--shadow);
    cursor: pointer;
  }
  .selector-item:active { box-shadow: 0 0 0 var(--shadow); transform: translate(3px, 3px); }
  .selector-item.active { background: var(--mauve); }
  .selector-item .bed-wrap { position: relative; width: 100px; height: 82px; display: flex; align-items: flex-end; justify-content: center; }
  .selector-item .bed-wrap canvas.bed { position: absolute; bottom: 0; width: 100px; height: 44px; }
  .selector-item .bed-wrap img.mini-cat { position: relative; width: 78px; height: auto; max-height: 76px; object-fit: contain; z-index: 1; image-rendering: pixelated; }
  .selector-item .name {
    font-family: 'VT323', monospace;
    font-size: 17px;
    color: var(--ink);
    text-align: center;
  }

  @media (max-width: 900px) {
    .desktop { justify-content: center; }
    .side-col { align-items: center; width: 100%; max-width: 500px; }
    .timer-wrap { align-items: center; }
    .scene { justify-content: center; }
  }
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

  <div class="confetti-layer" id="confettiLayer"></div>

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
(function () {
  "use strict";

  /* ============================================================
     PIXEL SPRITE ENGINE — rects authored on a unit grid, mirrored
     across a vertical axis so only the left half needs authoring.
     ============================================================ */

  function drawRects(ctx, unit, rects) {
    rects.forEach((r) => {
      ctx.fillStyle = r.color;
      ctx.fillRect(r.x * unit, r.y * unit, r.w * unit, r.h * unit);
    });
  }

  function mirrorRects(rects, gridW) {
    return rects.map((r) => ({ ...r, x: gridW - r.x - r.w }));
  }

  function setupCanvas(canvas, gridW, gridH, unit) {
    canvas.width = gridW * unit;
    canvas.height = gridH * unit;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return ctx;
  }

  /* ---------------- cat sprite (real pixel-art images) ---------------- */
  const BREEDS = [
    { name: "Smokey", src: "assets/cat_smoke.png" },
    { name: "Ginger", src: "assets/cat_ginger.png" },
    { name: "Tabby", src: "assets/cat_tabby.png" },
  ];

  let breedIndex = 0;

  function renderMainCat() {

    document.getElementById("sceneCaption").textContent = "MEET " + BREEDS[breedIndex].name.toUpperCase() + " — CLICK TO CHANGE";

  /* ---------------- bowl sprite ---------------- */
  function renderBowl(canvas) {
    const scale = 6;
    const ctx = setupCanvas(canvas, 18, 10, scale);
    ctx.fillStyle = "#8a6fc2";
    [[3, 3, 12, 4], [4, 7, 10, 1], [2, 2, 14, 1]].forEach(([x, y, w2, h2]) => {
      ctx.fillRect(x * scale, y * scale, w2 * scale, h2 * scale);
    });
    ctx.fillStyle = "#b39ae0";
    ctx.fillRect(3 * scale, 3 * scale, 12 * scale, 1 * scale);
    ctx.fillStyle = "#e08fae";
    ctx.fillRect(4 * scale, 1 * scale, 10 * scale, 2 * scale);
    ctx.fillStyle = "#f4b6cd";
    [[5, 1], [8, 1], [11, 1], [6, 0], [10, 0]].forEach(([x, y]) => {
      ctx.fillRect(x * scale, y * scale, scale, scale);
    });
    // paw print on the bowl rim
    ctx.fillStyle = "#fdfaff";
    ctx.fillRect(7 * scale, 5 * scale, 3 * scale, 2 * scale);
    ctx.fillRect(7 * scale, 4 * scale, 1 * scale, 1 * scale);
    ctx.fillRect(9 * scale, 4 * scale, 1 * scale, 1 * scale);
  }

  /* ---------------- small round bed (cat selector) ---------------- */
  function renderBed(canvas) {

    ctx.fillStyle = "#cdb3ea";
    ctx.fillRect(2 * scale, 1 * scale, 16 * scale, 2 * scale);
    ctx.fillStyle = "#e4dbfa";

  }

  /* ---------------- window titlebar icon ---------------- */
  function renderWinIcon(canvas) {

    const ctx = setupCanvas(canvas, 10, 10, scale);
    ctx.fillStyle = "#5c3f6e";
    ctx.fillRect(0, 0, 10 * scale, 10 * scale);
    ctx.fillStyle = "#fdfaff";
    ctx.fillRect(1 * scale, 1 * scale, 8 * scale, 6 * scale);
    ctx.fillStyle = "#a79bc4";
    ctx.fillRect(2 * scale, 2 * scale, 2 * scale, 2 * scale);
    ctx.fillRect(6 * scale, 2 * scale, 2 * scale, 2 * scale);
    ctx.fillStyle = "#5c3f6e";

  /* ---------------- camera placeholder icon ---------------- */

    ctx.fillRect(11 * scale, 4 * scale, 2 * scale, 4 * scale);
    ctx.fillStyle = "#fdfaff";
    ctx.fillRect(3 * scale, 5 * scale, 6 * scale, 4 * scale);
    ctx.fillStyle = "#c8b8d6";
    ctx.fillRect(4 * scale, 6 * scale, 4 * scale, 2 * scale);
  }

  /* ---------------- reset icon ---------------- */
  function renderResetIcon(canvas) {
    const scale = 2;
    const ctx = setupCanvas(canvas, 12, 12, scale);
    ctx.strokeStyle = "#5c3f6e";
    ctx.lineWidth = 2 * scale;
    ctx.beginPath();
    ctx.arc(6 * scale, 6 * scale, 4 * scale, 0.5, Math.PI * 1.7);
    ctx.stroke();
    ctx.fillStyle = "#5c3f6e";
    ctx.beginPath();
    ctx.moveTo(9.5 * scale, 2.5 * scale);
    ctx.lineTo(9.5 * scale, 6 * scale);
    ctx.lineTo(6.5 * scale, 4 * scale);
    ctx.closePath();
    ctx.fill();
  }

  /* ============================================================
     AUDIO — cozy lofi background track + a synthesized completion
     chime (the chime stays procedural since it's just a short SFX;
     the background track is the user-supplied lofi loop).
     ============================================================ */

  const AudioCtor = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let musicEnabled = localStorage.getItem("focusCatMusicEnabled") !== "0";
  const bgMusic = document.getElementById("bgMusic");
  bgMusic.volume = 0.35;

  function startMusic() {
    if (!musicEnabled) return;
    const p = bgMusic.play();
    if (p && p.catch) p.catch(() => {});
  }

  function stopMusic() {
    bgMusic.pause();
  }

  function setMusicEnabled(enabled) {
    musicEnabled = enabled;
    localStorage.setItem("focusCatMusicEnabled", enabled ? "1" : "0");
    if (enabled && running && !complete) startMusic();
    else if (!enabled) bgMusic.pause();
    renderMusicIcon(document.getElementById("musicIcon"), musicEnabled);
  }

  function ensureAudio() {
    if (audioCtx) return;
    audioCtx = new AudioCtor();
  }

  function playCompletionChime() {
    ensureAudio();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6 — bright, happy arpeggio
    const chimeGain = audioCtx.createGain();
    chimeGain.gain.value = musicEnabled ? 0.22 : 0.22;
    chimeGain.connect(audioCtx.destination);
    notes.forEach((freq, i) => {
      const start = now + i * 0.14;
      const osc = audioCtx.createOscillator();
      osc.type = "triangle";
      osc.frequency.value = freq;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(0.9, start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, start + 0.9);
      osc.connect(g).connect(chimeGain);
      osc.start(start);
      osc.stop(start + 1);
    });
  }

  function renderMusicIcon(canvas, on) {
    const scale = 2;
    const ctx = setupCanvas(canvas, 12, 12, scale);
    ctx.fillStyle = "#5c3f6e";
    ctx.fillRect(1 * scale, 4 * scale, 3 * scale, 4 * scale);
    ctx.fillRect(4 * scale, 3 * scale, 1 * scale, 6 * scale);
    ctx.fillRect(5 * scale, 2 * scale, 1 * scale, 8 * scale);
    if (on) {
      ctx.strokeStyle = "#5c3f6e";
      ctx.lineWidth = scale * 0.8;
      ctx.beginPath();
      ctx.arc(6 * scale, 6 * scale, 3 * scale, -0.6, 0.6);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(6 * scale, 6 * scale, 5 * scale, -0.6, 0.6);
      ctx.stroke();
    } else {
      ctx.strokeStyle = "#b6538a";
      ctx.lineWidth = scale * 0.9;
      ctx.beginPath();
      ctx.moveTo(8 * scale, 3 * scale);
      ctx.lineTo(11 * scale, 9 * scale);
      ctx.moveTo(11 * scale, 3 * scale);
      ctx.lineTo(8 * scale, 9 * scale);
      ctx.stroke();
    }
  }

  /* ============================================================
     APP STATE + LOGIC
     ============================================================ */

  const MODEL_URL = "https://justadudewhohacks.github.io/face-api.js/models";
  const DETECT_INTERVAL_MS = 400;
  const BLOCK_COUNT = 3;
  const BLOCK_HEIGHT = 40; // px vertical step between stacked ice cubes (tight overlap so the pile reads as one tower)

  const video = document.getElementById("video");
  const winContent = document.getElementById("winContent");
  const statusBar = document.getElementById("statusBar");
  const statusText = document.getElementById("statusText");
  const statusRight = document.getElementById("statusRight");
  const timerPlaque = document.getElementById("timerPlaque");
  const timerDigits = document.getElementById("timerDigits");
  const playBtn = document.getElementById("playBtn");
  const playIcon = document.getElementById("playIcon");
  const resetTimerBtn = document.getElementById("resetTimerBtn");
  const iceBlocks = Array.from(document.querySelectorAll(".ice-block"));
  const catSprite = document.getElementById("catSprite");
  const completeMsg = document.getElementById("completeMsg");
  const warnMsg = document.getElementById("warnMsg");
  const waterPuddle = document.getElementById("waterPuddle");
  const sceneCaption = document.getElementById("sceneCaption");
  const overlay = document.getElementById("overlay");
  const selectorGrid = document.getElementById("selectorGrid");

  let totalMs = 25 * 60000;
  let remainingMs = totalMs;
  let durationSet = true;
  let blocksRemaining = BLOCK_COUNT;
  let running = false;
  let complete = false;
  let faceDetected = false;
  let modelsLoaded = false;
  let stream = null;
  let detectionTimer = null;
  let rafId = null;
  let lastTimestamp = null;
  let editing = false;

  function formatTime(ms) {
    const totalSec = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function renderTimer() {
    if (editing) return;
    timerDigits.classList.toggle("empty", !durationSet);
    timerDigits.textContent = durationSet ? formatTime(remainingMs) : "--:--:--";
  }

  function setStatus(mode) {
    statusBar.classList.remove("watching", "detected");
    if (mode === "watching") statusBar.classList.add("watching");
    if (mode === "detected") statusBar.classList.add("detected");
    statusText.textContent =
      mode === "off" ? "CAMERA OFF" : mode === "watching" ? "NO FACE DETECTED" : "FACE DETECTED";
    statusRight.textContent = mode === "off" ? "READY" : running ? "MELTING" : "PAUSED";
    warnMsg.classList.toggle("show", running && !complete && mode === "watching");
    updateWaterPuddle();
  }

  function updateWaterPuddle() {
    const melted = BLOCK_COUNT - blocksRemaining;
    waterPuddle.className = "water-puddle" + (melted > 0 ? " size-" + melted : "");
    const activelyMelting = running && faceDetected && !complete && remainingMs > 0;
    waterPuddle.classList.toggle("melting", activelyMelting);
  }

  function positionCat(animate) {
    const bottom = blocksRemaining * BLOCK_HEIGHT;
    catSprite.style.transition = animate ? "" : "none";
    catSprite.style.bottom = bottom + "px";
    if (!animate) requestAnimationFrame(() => { catSprite.style.transition = ""; });
  }

  function updateBlocksVisual() {
    iceBlocks.forEach((block) => {
      const idx = Number(block.dataset.block);
      block.classList.toggle("melted", idx >= blocksRemaining);
      block.style.setProperty("--shrink", "1");
    });
    updateWaterPuddle();
  }

  function updateActiveShrink(remaining, segmentFrac) {
    const activeIdx = remaining - 1;
    iceBlocks.forEach((block) => {
      if (block.classList.contains("melted")) return;
      const idx = Number(block.dataset.block);
      const scale = idx === activeIdx ? Math.max(0.55, 1 - segmentFrac * 0.45) : 1;
      block.style.setProperty("--shrink", scale.toFixed(3));
    });
  }

  function popBlock() {
    positionCat(true);
    updateBlocksVisual();
  }

  function resetSceneInstant() {
    blocksRemaining = BLOCK_COUNT;
    updateBlocksVisual();
    positionCat(false);
  }

  function setPlayIcon(isRunning) {
    playBtn.innerHTML = "";
    if (isRunning) {
      const bars = document.createElement("span");
      bars.className = "pause-bars";
      bars.innerHTML = "<span></span><span></span>";
      playBtn.appendChild(bars);
      playBtn.classList.add("running");
    } else {
      const tri = document.createElement("span");
      tri.className = "play-tri";
      playBtn.appendChild(tri);
      playBtn.classList.remove("running");
    }
  }

  function enterComplete() {
    complete = true;
    running = false;
    completeMsg.classList.add("show");
    sceneCaption.textContent = "SESSION COMPLETE — " + BREEDS[breedIndex].name.toUpperCase() + " IS PROUD OF YOU";
    catSprite.classList.add("bounce");
    setTimeout(() => catSprite.classList.remove("bounce"), 1600);
    spawnConfetti();
    playCompletionChime();
    stopLoops();
    stopCamera();
    stopMusic();
    setStatus("off");
    setPlayIcon(false);
    renderTimer();
  }

  const CONFETTI_COLORS = ["#e79dc0", "#a79bc4", "#8fd6b4", "#f3ce6d", "#6fb3e0", "#fdfaff"];

  function spawnConfetti() {
    const layer = document.getElementById("confettiLayer");
    layer.innerHTML = "";
    const count = 46;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      const size = 6 + Math.random() * 6;
      const rot = (Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 540);
      piece.style.left = Math.random() * 100 + "%";
      piece.style.width = size + "px";
      piece.style.height = size + "px";
      piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      piece.style.setProperty("--rot", rot + "deg");
      piece.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
      piece.style.animationDelay = (Math.random() * 0.5) + "s";
      layer.appendChild(piece);
    }
    setTimeout(() => { layer.innerHTML = ""; }, 3600);
  }

  async function loadModels() {
    if (modelsLoaded) return;
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    modelsLoaded = true;
  }

  async function detectLoop() {
    if (!running || video.readyState < 2) return;
    try {
      const result = await faceapi.detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 })
      );
      faceDetected = !!result;
    } catch (err) {
      faceDetected = false;
    }
    if (!complete) setStatus(faceDetected ? "detected" : "watching");
  }

  function animationLoop(timestamp) {
    if (!running) return;
    if (lastTimestamp === null) lastTimestamp = timestamp;
    const dt = timestamp - lastTimestamp;
    lastTimestamp = timestamp;

    if (faceDetected && remainingMs > 0) {
      remainingMs = Math.max(0, remainingMs - dt);
      const elapsed = totalMs - remainingMs;
      const perBlock = totalMs / BLOCK_COUNT;
      const newBlocksRemaining = Math.max(0, BLOCK_COUNT - Math.floor(elapsed / perBlock + 1e-9));
      if (newBlocksRemaining !== blocksRemaining) {
        blocksRemaining = newBlocksRemaining;
        popBlock();
      }
      if (blocksRemaining > 0) {
        const segmentFrac = (elapsed % perBlock) / perBlock;
        updateActiveShrink(blocksRemaining, segmentFrac);
      }
      renderTimer();
      if (remainingMs <= 0) {
        blocksRemaining = 0;
        updateBlocksVisual();
        positionCat(true);
        enterComplete();
        return;
      }
    }

    rafId = requestAnimationFrame(animationLoop);
  }

  function stopLoops() {
    if (detectionTimer) clearInterval(detectionTimer);
    if (rafId) cancelAnimationFrame(rafId);
    detectionTimer = null;
    rafId = null;
    lastTimestamp = null;
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
    }
    video.srcObject = null;
    winContent.classList.remove("live");
  }

  async function startSession() {
    if (!durationSet || remainingMs <= 0) return;
    playBtn.disabled = true;
    completeMsg.classList.remove("show");
    complete = false;

    try {
      if (typeof faceapi === "undefined") {
        sceneCaption.textContent = "FACE DETECTOR FAILED TO LOAD";
        playBtn.disabled = false;
        return;
      }
      statusRight.textContent = "LOADING...";
      await loadModels();

      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = stream;
      await video.play();
      winContent.classList.add("live");

      blocksRemaining = Math.max(0, Math.ceil((remainingMs / totalMs) * BLOCK_COUNT));
      updateBlocksVisual();
      positionCat(false);

      running = true;
      faceDetected = false;
      lastTimestamp = null;
      setStatus("watching");
      sceneCaption.textContent = "STAY IN FRAME TO MELT THE ICE";
      setPlayIcon(true);
      renderTimer();
      startMusic();

      detectionTimer = setInterval(detectLoop, DETECT_INTERVAL_MS);
      rafId = requestAnimationFrame(animationLoop);
    } catch (err) {
      sceneCaption.textContent = "CAMERA ACCESS DENIED";
    } finally {
      playBtn.disabled = false;
    }
  }

  function pauseSession() {
    running = false;
    stopLoops();
    stopCamera();
    stopMusic();
    setStatus("off");
    setPlayIcon(false);
    sceneCaption.textContent = "PAUSED — PRESS PLAY TO RESUME";
  }

  function resetAll() {
    running = false;
    complete = false;
    faceDetected = false;
    stopLoops();
    stopCamera();
    stopMusic();
    durationSet = false;
    totalMs = 0;
    remainingMs = 0;
    resetSceneInstant();
    completeMsg.classList.remove("show");
    setStatus("off");
    sceneCaption.textContent = "CLICK THE TIMER TO SET A SESSION";
    setPlayIcon(false);
    playBtn.disabled = false;
    renderTimer();
  }

  function beginEdit() {
    if (running) return;
    editing = true;
    const current = durationSet ? Math.round(remainingMs / 60000) : "";
    const input = document.createElement("input");
    input.type = "text";
    input.inputMode = "numeric";
    input.autocomplete = "off";
    input.placeholder = "25 or 00:25:00";
    input.value = current === "" ? "" : String(current);
    timerDigits.replaceWith(input);
    input.focus();
    input.select();

    function commit() {
      const val = parseDuration(input.value);
      if (val !== null && val > 0) {
        totalMs = val;
        remainingMs = val;
        durationSet = true;
        complete = false;
        completeMsg.classList.remove("show");
        resetSceneInstant();
        sceneCaption.textContent = "READY — PRESS PLAY TO START";
      }
      finishEdit();
    }
    function cancel() { finishEdit(); }
    function finishEdit() {
      editing = false;
      input.replaceWith(timerDigits);
      renderTimer();
    }
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); commit(); }
      else if (e.key === "Escape") { e.preventDefault(); cancel(); }
    });
    input.addEventListener("blur", () => { if (editing) commit(); });
  }

  function parseDuration(raw) {
    const str = raw.trim();
    if (!str) return null;
    if (str.includes(":")) {
      const parts = str.split(":").map((p) => parseInt(p, 10));
      if (parts.some((n) => isNaN(n))) return null;
      let h = 0, m = 0, s = 0;
      if (parts.length === 3) [h, m, s] = parts;
      else if (parts.length === 2) [m, s] = parts;
      else return null;
      return (h * 3600 + m * 60 + s) * 1000;
    }
    const mins = parseFloat(str);
    if (isNaN(mins) || mins <= 0) return null;
    return Math.round(mins * 60000);
  }

  /* ---------------- cat selector popup ---------------- */
  function openSelector() {
    selectorGrid.innerHTML = "";
    BREEDS.forEach((breed, idx) => {
      const item = document.createElement("div");
      item.className = "selector-item" + (idx === breedIndex ? " active" : "");
      const bedWrap = document.createElement("div");
      bedWrap.className = "bed-wrap";
      const bedCanvas = document.createElement("canvas");
      bedCanvas.className = "bed";
      const catImg = document.createElement("img");
      catImg.className = "mini-cat";
      catImg.src = breed.src;
      catImg.alt = breed.name;
      catImg.draggable = false;
      bedWrap.appendChild(bedCanvas);
      bedWrap.appendChild(catImg);
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = breed.name;
      item.appendChild(bedWrap);
      item.appendChild(name);
      item.addEventListener("click", () => {
        breedIndex = idx;
        renderMainCat();
        closeSelector();
        catSprite.classList.remove("click-pop");
        void catSprite.offsetWidth;
        catSprite.classList.add("click-pop");
      });
      selectorGrid.appendChild(item);
      renderBed(bedCanvas);
    });
    overlay.classList.add("show");
  }
  function closeSelector() {
    overlay.classList.remove("show");
  }

  /* ---------------- wire up events ---------------- */
  timerPlaque.addEventListener("click", beginEdit);
  playBtn.addEventListener("click", () => {
    if (running) { pauseSession(); return; }
    if (complete) {
      complete = false;
      completeMsg.classList.remove("show");
      remainingMs = totalMs;
      resetSceneInstant();
    }
    startSession();
  });
  resetTimerBtn.addEventListener("click", resetAll);
  document.getElementById("musicBtn").addEventListener("click", () => setMusicEnabled(!musicEnabled));
  catSprite.addEventListener("click", openSelector);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeSelector(); });
  document.getElementById("popupCloseBtn").addEventListener("click", closeSelector);
  document.getElementById("minBtn").addEventListener("click", () => {});
  document.getElementById("maxBtn").addEventListener("click", () => {});
  document.getElementById("closeBtn").addEventListener("click", () => {
    if (confirm("Close Focus Cat?")) window.close();
  });

  /* ---------------- init ---------------- */
  buildDecorations();
  renderWinIcon(document.getElementById("iconCanvas"));
  renderWinIcon(document.getElementById("iconCanvas2"));
  renderCamIcon(document.getElementById("camIcon"));
  renderResetIcon(document.getElementById("resetIcon"));
  renderMusicIcon(document.getElementById("musicIcon"), musicEnabled);
  renderMainCat();
  renderBowl(document.getElementById("bowlCanvas"));
  iceBlocks.forEach((block) => {
    block.style.bottom = Number(block.dataset.block) * BLOCK_HEIGHT + "px";
  });
  setPlayIcon(false);
  resetSceneInstant();
  renderTimer();
  setStatus("off");
})();
</script>

</body>
